<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BENUO SMART — Superapps Pemkab Penajam Paser Utara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#0F766E; --green-deep:#0A5248; --green-soft:#E6F2F0;
    --gold:#D99A2B; --gold-soft:#FBF1DC;
    --ink:#12211D; --muted:#5B6B66; --line:#E4EAE8;
    --paper:#F5F8F7; --card:#FFFFFF;
    --c-admin:#2563EB; --c-publik:#16A34A; --c-pajak:#EA580C;
    --c-info:#7C3AED; --c-smart:#0891B2; --c-profil:#DB2777; --c-lain:#475569;
    --radius:18px; --shadow:0 1px 2px rgba(16,40,34,.06),0 8px 24px rgba(16,40,34,.06);
    --shadow-lg:0 12px 40px rgba(16,40,34,.14);
    --app-max:480px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
    background:#DDE6E3;color:var(--ink);line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  img{max-width:100%;display:block}

  /* ---------- APP SHELL (phone-like column) ---------- */
  .shell{
    max-width:var(--app-max);margin:0 auto;min-height:100vh;background:var(--paper);
    position:relative;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.12);
  }
  @media(min-width:1024px){
    body{display:flex;align-items:flex-start;justify-content:center;padding:0}
    .shell{margin:0}
  }

  /* ---------- HEADER ---------- */
  .topbar{
    position:sticky;top:0;z-index:40;
    background:linear-gradient(135deg,var(--green) 0%,var(--green-deep) 100%);
    color:#fff;padding:14px 18px 20px;
  }
  .topbar .row{display:flex;align-items:center;gap:12px}
  .seal{
    width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.16);
    display:grid;place-items:center;flex:none;border:1px solid rgba(255,255,255,.25);
    backdrop-filter:blur(4px);
  }
  .brand-name{font-weight:800;font-size:16px;letter-spacing:.3px;line-height:1.1}
  .brand-sub{font-size:11px;opacity:.85;font-weight:500}
  .top-actions{margin-left:auto;display:flex;gap:8px}
  .icon-btn{
    width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.14);
    display:grid;place-items:center;color:#fff;position:relative;
    border:1px solid rgba(255,255,255,.14);transition:.15s;
  }
  .icon-btn:active{transform:scale(.92)}
  .badge-dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;
    background:var(--gold);border:2px solid var(--green-deep)}
  .searchbar{
    margin-top:16px;background:#fff;border-radius:14px;padding:11px 14px;
    display:flex;align-items:center;gap:10px;color:var(--muted);
    box-shadow:0 6px 18px rgba(10,82,72,.18);
  }
  .searchbar input{border:none;outline:none;flex:1;font-family:inherit;font-size:14px;color:var(--ink);background:none}

  /* ---------- SECTIONS ---------- */
  .view{padding:18px 18px 108px;animation:fade .28s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 12px}
  .sec-title{font-size:15px;font-weight:800}
  .sec-link{font-size:12.5px;color:var(--green);font-weight:700}

  /* ---------- HERO GREETING ---------- */
  .hero{
    margin-top:-6px;background:var(--card);border-radius:var(--radius);
    padding:16px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;
  }
  .avatar{width:46px;height:46px;border-radius:50%;flex:none;
    background:linear-gradient(135deg,var(--gold),#B9781A);color:#fff;
    display:grid;place-items:center;font-weight:800;font-size:18px}
  .hero h2{margin:0;font-size:15px}
  .hero p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
  .weather{margin-left:auto;text-align:right;flex:none}
  .weather b{font-size:18px;font-weight:800}
  .weather span{display:block;font-size:11px;color:var(--muted)}

  /* ---------- QUICK STATS strip ---------- */
  .strip{display:flex;gap:10px;margin-top:14px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .strip::-webkit-scrollbar{display:none}
  .pill{flex:none;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:10px 13px;font-size:12px;font-weight:600;color:var(--muted);display:flex;gap:8px;align-items:center}
  .pill b{color:var(--ink);font-weight:800}

  /* ---------- CATEGORY GRID (7 layanan utama) ---------- */
  .cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 6px}
  .cat{background:none;text-align:center;display:flex;flex-direction:column;align-items:center;gap:7px;padding:4px 2px}
  .cat .ic{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;
    color:#fff;box-shadow:0 6px 16px rgba(16,40,34,.12);transition:.15s}
  .cat:active .ic{transform:translateY(2px) scale(.96)}
  .cat span{font-size:11px;font-weight:600;color:var(--ink);line-height:1.2}

  /* ---------- POPULAR services ---------- */
  .pop-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .pop{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;gap:10px;text-align:left;transition:.15s;border:1px solid var(--line)}
  .pop:active{transform:scale(.98)}
  .pop .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff}
  .pop b{font-size:13px}
  .pop small{font-size:11px;color:var(--muted)}

  /* ---------- NEWS ---------- */
  .news{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);
    display:flex;margin-bottom:12px;border:1px solid var(--line);text-align:left}
  .news .thumb{width:96px;flex:none;background:linear-gradient(135deg,var(--green-soft),#D4E8E4);
    display:grid;place-items:center;color:var(--green)}
  .news .body{padding:12px 14px}
  .news .tag{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--gold)}
  .news h4{margin:4px 0 4px;font-size:13.5px;line-height:1.3}
  .news small{font-size:11px;color:var(--muted)}

  /* ---------- BANNER ---------- */
  .banner{margin-top:14px;border-radius:var(--radius);padding:18px;color:#fff;position:relative;overflow:hidden;
    background:linear-gradient(120deg,var(--gold) 0%,#C07C15 100%)}
  .banner h3{margin:0 0 4px;font-size:15px}
  .banner p{margin:0;font-size:12px;opacity:.92;max-width:80%}
  .banner .deco{position:absolute;right:-20px;top:-20px;width:120px;height:120px;border-radius:50%;
    background:rgba(255,255,255,.14)}
  .banner .deco2{position:absolute;right:30px;bottom:-40px;width:90px;height:90px;border-radius:50%;
    background:rgba(255,255,255,.1)}

  /* ---------- SUBPAGE HEADER ---------- */
  .subhead{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line);
    padding:14px 16px;display:flex;align-items:center;gap:12px}
  .subhead .back{width:38px;height:38px;border-radius:11px;background:var(--green-soft);color:var(--green);
    display:grid;place-items:center;flex:none}
  .subhead h1{margin:0;font-size:16px;font-weight:800}
  .subhead p{margin:0;font-size:11.5px;color:var(--muted)}

  /* ---------- SERVICE GROUP LIST ---------- */
  .group{margin-top:20px}
  .group-h{display:flex;align-items:center;gap:10px;margin:0 2px 10px}
  .group-h .gi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff}
  .group-h b{font-size:14px}
  .svc-list{display:flex;flex-direction:column;gap:8px}
  .svc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    display:flex;align-items:center;gap:13px;box-shadow:var(--shadow);transition:.15s;text-align:left;width:100%}
  .svc:active{transform:scale(.99);background:#FAFDFC}
  .svc .si{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;color:#fff}
  .svc .txt{flex:1}
  .svc .txt b{font-size:13.5px;display:block}
  .svc .txt small{font-size:11.5px;color:var(--muted)}
  .svc .chev{color:var(--muted)}
  .tagchip{font-size:9.5px;font-weight:800;padding:3px 7px;border-radius:20px;background:var(--green-soft);color:var(--green);text-transform:uppercase;letter-spacing:.4px}

  /* ---------- DETAIL / FORM ---------- */
  .detail-hero{border-radius:var(--radius);padding:20px;color:#fff;margin-bottom:16px;box-shadow:var(--shadow)}
  .detail-hero .di{width:52px;height:52px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center;margin-bottom:12px}
  .detail-hero h2{margin:0 0 4px;font-size:19px}
  .detail-hero p{margin:0;font-size:12.5px;opacity:.9}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px}
  .field input,.field select,.field textarea{
    width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;
    font-family:inherit;font-size:14px;outline:none;background:var(--card);color:var(--ink);transition:.15s}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
  .steps{display:flex;gap:6px;margin-bottom:18px}
  .step{flex:1;height:5px;border-radius:20px;background:var(--line)}
  .step.on{background:var(--green)}
  .card-box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  .info-row{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px dashed var(--line);font-size:13px}
  .info-row:last-child{border:none}
  .info-row span{color:var(--muted)}
  .info-row b{font-weight:700}
  .btn{display:block;width:100%;padding:15px;border-radius:14px;font-weight:800;font-size:14.5px;text-align:center;transition:.15s}
  .btn-primary{background:var(--green);color:#fff;box-shadow:0 8px 20px rgba(15,118,110,.3)}
  .btn-primary:active{transform:scale(.98)}
  .btn-gold{background:var(--gold);color:#fff}
  .btn-ghost{background:var(--green-soft);color:var(--green)}
  .notice{background:var(--gold-soft);border:1px solid #EBD9A8;border-radius:12px;padding:12px 14px;font-size:12px;color:#8A6414;display:flex;gap:10px}

  /* ---------- STATUS / TRACKING ---------- */
  .timeline{position:relative;padding-left:26px}
  .timeline::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
  .tl-item{position:relative;padding-bottom:20px}
  .tl-item::before{content:"";position:absolute;left:-21px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--line)}
  .tl-item.done::before{background:var(--green);border-color:var(--green)}
  .tl-item.now::before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
  .tl-item b{font-size:13.5px}
  .tl-item small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}

  /* ---------- CCTV grid ---------- */
  .cctv-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cctv{border-radius:14px;overflow:hidden;background:#101a17;aspect-ratio:4/3;position:relative;box-shadow:var(--shadow)}
  .cctv .live{position:absolute;top:8px;left:8px;background:#DC2626;color:#fff;font-size:9px;font-weight:800;padding:2px 7px;border-radius:20px;display:flex;align-items:center;gap:4px}
  .cctv .live::before{content:"";width:5px;height:5px;border-radius:50%;background:#fff;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.3}}
  .cctv .lbl{position:absolute;bottom:0;left:0;right:0;padding:18px 10px 8px;color:#fff;font-size:11px;font-weight:600;
    background:linear-gradient(transparent,rgba(0,0,0,.7))}
  .cctv .scan{position:absolute;inset:0;display:grid;place-items:center;color:#3a5650}

  /* ---------- PROFILE ---------- */
  .prof-hero{background:linear-gradient(135deg,var(--green),var(--green-deep));border-radius:var(--radius);
    padding:22px;color:#fff;text-align:center;box-shadow:var(--shadow);margin-bottom:16px}
  .prof-hero .pa{width:76px;height:76px;border-radius:50%;background:rgba(255,255,255,.2);margin:0 auto 12px;
    display:grid;place-items:center;font-size:30px;font-weight:800;border:3px solid rgba(255,255,255,.35)}
  .prof-hero h2{margin:0;font-size:18px}
  .prof-hero p{margin:3px 0 0;font-size:12px;opacity:.85}
  .verified{display:inline-flex;align-items:center;gap:5px;margin-top:10px;background:rgba(255,255,255,.18);
    padding:5px 12px;border-radius:20px;font-size:11px;font-weight:700}
  .menu-list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
  .menu-item{display:flex;align-items:center;gap:13px;padding:15px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left;transition:.15s}
  .menu-item:last-child{border:none}
  .menu-item:active{background:#FAFDFC}
  .menu-item .mi{width:36px;height:36px;border-radius:10px;background:var(--green-soft);color:var(--green);display:grid;place-items:center;flex:none}
  .menu-item b{font-size:13.5px;flex:1}

  /* ---------- NOTIF ---------- */
  .notif{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:12px;margin-bottom:10px;box-shadow:var(--shadow)}
  .notif.unread{border-left:3px solid var(--green)}
  .notif .ni{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff;flex:none}
  .notif b{font-size:13px}
  .notif p{margin:3px 0 0;font-size:12px;color:var(--muted)}
  .notif small{font-size:10.5px;color:var(--muted);margin-top:4px;display:block}

  /* ---------- BOTTOM NAV ---------- */
  .botnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:var(--app-max);
    background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);
    display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:50}
  .nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10px;font-weight:600;padding:4px 0}
  .nav-item.active{color:var(--green)}
  .nav-item .ni{transition:.15s}
  .nav-item.active .ni{transform:translateY(-1px)}
  .nav-center{flex:1;display:flex;justify-content:center}
  .nav-center button{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#B9781A);
    color:#fff;display:grid;place-items:center;margin-top:-22px;box-shadow:0 8px 20px rgba(217,154,43,.4);border:4px solid var(--paper)}

  /* ---------- misc ---------- */
  .footer-note{text-align:center;font-size:10.5px;color:var(--muted);margin-top:28px;line-height:1.6}
  .empty{text-align:center;padding:40px 20px;color:var(--muted)}
  .empty svg{margin-bottom:12px;opacity:.5}
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
    padding:12px 20px;border-radius:30px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:100;max-width:88%}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="shell">
  <div id="header"></div>
  <div id="app"></div>
  <nav class="botnav" id="botnav"></nav>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   BENUO SMART — data model (dari sitemap PPU)
========================================================= */
const ICONS = {

  cam:'M4 8h3l2-2h6l2 2h3v11H4zM12 16a3.5 3.5 0 1 0 0-7',
  folder:'M3 6a1 1 0 0 1 1-1h5l2 2h8a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z',
  gear:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6M19 12a7 7 0 0 0-.1-1l2-1.6-2-3.5-2.4 1a7 7 0 0 0-1.7-1L14.5 2h-4l-.3 2.9a7 7 0 0 0-1.7 1l-2.4-1-2 3.5L4.1 11a7 7 0 0 0 0 2l-2 1.6 2 3.5 2.4-1a7 7 0 0 0 1.7 1l.3 2.9h4l.3-2.9a7 7 0 0 0 1.7-1l2.4 1 2-3.5-2-1.6a7 7 0 0 0 .1-1z',
  about:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M12 8h.01M11 12h1v4h1',
  faq:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17h.01',
  phone:'M5 3h3l2 5-2 1a12 12 0 0 0 5 5l1-2 5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z',
  help:'M18 8a6 6 0 0 0-12 0v5a3 3 0 0 0 3 3M6 13H4v3a2 2 0 0 0 2 2M18 13h2v3a2 2 0 0 0-2 2h-3',
  check:'M20 6L9 17l-5-5',
  building:'M3 21V6l7-3v18M10 21V8l8 3v10M3 21h18M6 11h.01M6 15h.01M14 14h.01M14 17h.01',
  wallet:'M3 6h16a1 1 0 0 1 1 1v3h-4a2 2 0 0 0 0 4h4v3a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zM17 12h.01',
  shield:'M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z',
  pin:'M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11zM12 12a2 2 0 1 0 0-4',
};
function icon(name,size=22,stroke=2){
  const d=ICONS[name]||ICONS.dots;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round">${d.split('M').filter(Boolean).map(p=>`<path d="M${p}"/>`).join('')}</svg>`;
}

/* =========================================================
   ROUTER
========================================================= */
function go(hash){ location.hash = hash; }
function currentRoute(){
  const h = decodeURIComponent(location.hash.replace(/^#\/?/,''));
  return h ? h.split('/') : ['home'];
}
window.addEventListener('hashchange', render);
window.addEventListener('load', render);

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200);
}

/* =========================================================
   RENDER
========================================================= */
function render(){
  const r = currentRoute();
  const app = document.getElementById('app');
  const header = document.getElementById('header');
  window.scrollTo(0,0);

  if(r[0]==='home'||r[0]===''){ header.innerHTML=mainHeader(); app.innerHTML=viewHome(); }
  else if(r[0]==='cari'){ header.innerHTML=mainHeader(); app.innerHTML=viewSearch(r[1]||''); }
  else if(r[0]==='notif'){ header.innerHTML=subHeader('Notifikasi','Pemberitahuan terbaru untuk Anda'); app.innerHTML=viewNotif(); }
  else if(r[0]==='profil-me'){ header.innerHTML=subHeader('Profil Pengguna','Akun & dokumen digital Anda'); app.innerHTML=viewProfile(); }
  else if(r[0]==='cat'){ const c=CATS.find(x=>x.id===r[1]); header.innerHTML=subHeader(c.title.replace('\n',' '),c.desc); app.innerHTML=viewCategory(c); }
  else if(r[0]==='svc'){ const c=CATS.find(x=>x.id===r[1]); header.innerHTML=subHeader(r[2],'Layanan '+c.title.replace('\n',' ')); app.innerHTML=viewService(c,r[2]); }
  else { header.innerHTML=subHeader('Halaman','Tidak ditemukan'); app.innerHTML=`<div class="view"><div class="empty">${icon('search',40)}<p>Halaman tidak ditemukan.</p></div></div>`; }

  document.getElementById('botnav').innerHTML = bottomNav(r);
}

/* ---------- SERVICE DETAIL (dynamic) ---------- */
function findService(cid,name){
  const c=CATS.find(x=>x.id===cid);
  for(const g of c.groups){ const it=g.items.find(i=>i[0]===name); if(it) return {c,g,it}; }
  return {c,g:c.groups[0],it:[name,'',c.icon]};
}
function viewService(c,name){
  const {g,it}=findService(c.id,name);
  const color=g.color;
  const hero=(body)=>`<div class="view">
    <div class="detail-hero" style="background:linear-gradient(135deg,${color},${shade(color)})">
      <div class="di">${icon(it[2],26)}</div>
      <h2>${name}</h2><p>${it[1]||'Layanan '+c.title.replace('\n',' ')}</p>
    </div>${body}</div>`;

  // Special-cased flows
  if(name==='KTP') return hero(formKTP());
  if(name==='Booking Layanan') return hero(formBooking());
  if(name==='PBB') return hero(payPBB());
  if(name==='Air (PDAM)') return hero(payPDAM());
  if(name==='CCTV Kota') return hero(cctvView());
  if(name==='Berita') return hero(newsList());
  if(name==='Statistik Daerah') return hero(statsView());
  if(name==='Daftar RS / Puskesmas') return hero(facilitiesView());
  if(name==='Data Diri') return hero(dataDiri());
  if(name==='Dokumen Digital') return hero(dokDigital());
  if(name==='FAQ') return hero(faqView());
  if(name==='Tentang Kami') return hero(aboutView());
  if(name==='Kontak') return hero(kontakView());

  // Generic service page
  return hero(genericService(name,color));
}

/* ---------- SEARCH ---------- */
function allServices(){
  const arr=[];
  CATS.forEach(c=>c.groups.forEach(g=>g.items.forEach(it=>arr.push({cid:c.id,name:it[0],desc:it[1],ic:it[2],color:g.color}))));
  return arr;
}
function viewSearch(q){
  const all=allServices();
  return `<div class="view">
    <div class="field" style="margin-top:4px">
      <input id="q" placeholder="Ketik nama layanan..." value="${q||''}" oninput="filterSvc(this.value)" autofocus>
    </div>
    <div class="sec-head"><div class="sec-title" id="qres">${q?'Hasil pencarian':'Semua layanan'}</div></div>
    <div class="svc-list" id="qlist">
      ${all.map(s=>svcRow(s)).join('')}
    </div>
  </div>`;
}
function svcRow(s){
  return `<button class="svc" data-name="${s.name.toLowerCase()}" onclick="go('/svc/${s.cid}/${encodeURIComponent(s.name)}')">
    <div class="si" style="background:${s.color}">${icon(s.ic,20)}</div>
    <div class="txt"><b>${s.name}</b><small>${s.desc}</small></div>${icon('chev',18)}</button>`;
}
function filterSvc(v){
  v=v.toLowerCase().trim();
  const rows=document.querySelectorAll('#qlist .svc');
  let n=0;
  rows.forEach(r=>{ const m=r.dataset.name.includes(v); r.style.display=m?'':'none'; if(m)n++; });
  document.getElementById('qres').textContent = v? (n+' hasil untuk "'+v+'"') : 'Semua layanan';
}

/* ---------- BOTTOM NAV ---------- */
function bottomNav(r){
  const active=(id)=>{
    if(id==='home') return r[0]==='home'||r[0]==='';
    if(id==='cat-publik') return r[0]==='cat'&&r[1]==='publik'|| (r[0]==='svc'&&r[1]==='publik');
    if(id==='cat-pajak') return (r[0]==='cat'&&r[1]==='pajak')||(r[0]==='svc'&&r[1]==='pajak');
    if(id==='cat-informasi') return (r[0]==='cat'&&r[1]==='informasi')||(r[0]==='svc'&&r[1]==='informasi');
    if(id==='profil') return r[0]==='profil-me';
    return false;
  };
  return `
    <button class="nav-item ${active('home')?'active':''}" onclick="go('/home')"><span class="ni">${icon('home',22)}</span>Beranda</button>
    <button class="nav-item ${active('cat-publik')?'active':''}" onclick="go('/cat/publik')"><span class="ni">${icon('people',22)}</span>Layanan</button>
    <div class="nav-center"><button onclick="go('/cari')">${icon('search',24)}</button></div>
    <button class="nav-item ${active('cat-informasi')?'active':''}" onclick="go('/cat/informasi')"><span class="ni">${icon('info',22)}</span>Info</button>
    <button class="nav-item ${active('profil')?'active':''}" onclick="go('/profil-me')"><span class="ni">${icon('user',22)}</span>Profil</button>`;
}
